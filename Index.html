<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7A1 AI BÁ KHÍ - Cyberpunk Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b14;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff007f;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-glow);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            font-size: 24px;
            color: var(--accent-cyan);
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Container & Chat Layout */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            gap: 16px;
            height: calc(100vh - 70px);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .controls label {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            padding: 8px 14px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .chat-box {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .msg {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--accent-cyan);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 12px;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            resize: none;
            height: 48px;
            max-height: 120px;
            padding: 10px;
        }

        textarea::placeholder {
            color: var(--text-dim);
        }

        button.btn-send {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: #080b14;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        button.btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }

        button.btn-send:active {
            transform: translateY(0);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <i class="fa-solid fa-bolt"></i>
        <h1>7A1 AI Bá Khí</h1>
    </div>
    <div class="status-badge">
        <div class="status-dot"></div>
        ONLINE & SECURE
    </div>
</header>

<div class="container">
    <div class="controls">
        <label for="mode"><i class="fa-solid fa-sliders"></i> Chế độ xử lý:</label>
        <select id="mode">
            <option value="general">🤖 Trò chuyện & Giải bài tập</option>
            <option value="code">💻 Siêu Trợ Lý Lập Trình (Full-Stack)</option>
            <option value="math">📐 Giải Toán / Lý / Hóa Chi Tiết</option>
        </select>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai">⚡ **7A1 AI BÁ KHÍ** đã sẵn sàng! Bạn cần giải bài tập, viết code hay sáng tạo nội dung gì hôm nay?</div>
    </div>

    <div class="input-group">
        <textarea id="userInput" placeholder="Nhập câu hỏi, đề bài hoặc yêu cầu viết code..." onkeydown="handleKeyPress(event)"></textarea>
        <button class="btn-send" onclick="sendPrompt()">
            <span>Gửi</span>
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendPrompt();
        }
    }

    async function sendPrompt() {
        const input = document.getElementById('userInput');
        const mode = document.getElementById('mode').value;
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text) return;

        // Thêm câu hỏi người dùng
        chatBox.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
        input.value = '';
        input.style.height = '48px';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Trạng thái chờ từ Server
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="msg ai" id="${loadingId}"><i class="fa-solid fa-spinner fa-spin"></i> 7A1 AI đang xử lý với tốc độ bá khí...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Gọi endpoint Backend bảo mật (Backend sẽ tự chèn API Key giấu trong file .env/Render)
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text, mode: mode })
            });

            const data = await res.json();
            const loadingElem = document.getElementById(loadingId);
            
            if (data.success) {
                loadingElem.innerHTML = formatAIResponse(data.reply);
            } else {
                loadingElem.innerText = "❌ " + (data.message || "Lỗi xử lý hệ thống!");
            }
        } catch (err) {
            document.getElementById(loadingId).innerText = "❌ Không thể kết nối tới Server Backend 7A1 AI!";
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(string) {
        return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatAIResponse(text) {
        // Biến đổi các đoạn markdown đơn giản thành HTML
        return text
            .replace(/```([\s\S]*?)```/g, '<pre style="background: #090d16; padding: 12px; border-radius: 8px; overflow-x: auto; font-family: monospace; border: 1px solid rgba(0,240,255,0.2); margin: 8px 0;"><code>$1</code></pre>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }
</script>

</body>
</html>
